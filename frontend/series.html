<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Comic Tracker — Serie</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow+Condensed:wght@400;500;600;700;800&family=Bowlby+One+SC&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="styles.css"
  >
</head>

<body>
  <main class="series-detail-page">

    <a href="/" class="back-link">
      ← Volver a mi colección
    </a>

    <section
      id="series-detail-header"
      class="series-detail-header"
    >
      <p>Cargando serie...</p>
    </section>

    <section class="series-progress-section">

      <div class="series-progress-heading">
        <h2>Tu colección</h2>

        <p id="series-progress-text">
          Calculando...
        </p>
      </div>

      <div class="series-progress-bar">
        <div
            id="series-progress-fill"
            class="series-progress-fill"
        ></div>

        <span
            id="series-progress-percentage"
            class="series-progress-percentage"
        >
            0%
        </span>
    </div>

    </section>

    <section
        id="series-batch-actions"
        class="series-batch-actions"
        >
        <div class="series-selection-info">
            <strong id="series-selection-count">
            0 seleccionados
            </strong>
        </div>

        <div class="series-selection-buttons">
            <button
            type="button"
            id="select-missing-button"
            >
            Seleccionar los que faltan
            </button>

            <button
            type="button"
            id="clear-series-selection"
            disabled
            >
            Limpiar selección
            </button>

            <button
            type="button"
            id="import-series-selection"
            disabled
            >
            Añadir seleccionados (0)
            </button>
        </div>
    </section>
    <p
      id="series-import-feedback"
      class="series-import-feedback"
      role="status"
      aria-live="polite"
      hidden
    ></p>

    <section>
      <div
        id="series-issues-grid"
        class="series-issues-grid"
      ></div>
    </section>

  </main>

  <script src="series.js"></script>
</body>
</html>
