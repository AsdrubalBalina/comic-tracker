<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Añadir cómic | Comic Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
  href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow+Condensed:wght@400;500;600;700;800&family=Bowlby+One+SC&display=swap"
  rel="stylesheet"
>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>Añadir cómic</h1>
    <p id="page-description">
        Incorpora un nuevo cómic a tu colección
    </p>
  </header>

  <main>
    <a href="/" class="back-link">
      ← Volver a mi colección
    </a>
    <section class="catalog-search">
    <div class="catalog-search-heading">
        <span class="section-kicker">CATÁLOGO EXTERNO</span>
        <h2>Buscar un cómic</h2>
        <p>
        Busca en Metron y completa automáticamente los datos
        antes de añadirlo a tu colección.
        </p>
    </div>

    <form id="catalog-search-form" class="catalog-search-form">
        <label for="catalog-query">Serie</label>

        <div class="catalog-search-row">
        <input
            type="search"
            id="catalog-query"
            placeholder="Ej. Batman, Daredevil, Amazing Spider-Man..."
            autocomplete="off"
            required
        >

        <button type="submit">
            Buscar
        </button>
        </div>
    </form>

    <p id="catalog-message" class="catalog-message"></p>

    <div
        id="catalog-results"
        class="catalog-results"
    ></div>
    </section>

    <div class="manual-divider">
    <span>O AÑADIR MANUALMENTE</span>
    </div>
    <form id="comic-form">
      <div>
        <label for="title">Título *</label>
        <input type="text" id="title" required>
      </div>

      <div>
        <label for="series">Serie</label>
        <input type="text" id="series">
      </div>

      <div>
        <label for="issue_number">Número</label>
        <input type="text" id="issue_number">
      </div>

      <div>
        <label for="publisher">Editorial</label>
        <input type="text" id="publisher">
      </div>

      <div>
        <label for="main_character">Personaje principal</label>
        <input type="text" id="main_character">
      </div>

      <div>
        <label for="writer">Guionista</label>
        <input
          type="text"
          id="writer"
          placeholder="Ej. Stan Lee"
        >
      </div>

      <div>
        <label for="artist">Dibujante principal</label>
        <input
          type="text"
          id="artist"
          placeholder="Ej. Jack Kirby"
        >
      </div>

      <div>
        <label for="cover_url">URL de portada</label>
        <input
          type="url"
          id="cover_url"
          placeholder="https://..."
        >
      </div>

      <div>
        <label for="publication_year">Año de publicación</label>
        <input
          type="number"
          id="publication_year"
        >
      </div>

      <div>
        <label for="read_status">Estado</label>
        <select id="read_status">
          <option value="pending">Pendiente</option>
          <option value="reading">Leyendo</option>
          <option value="read">Leído</option>
        </select>
      </div>

      <div>
        <label for="rating">Valoración</label>
        <select id="rating">
          <option value="">Sin valorar</option>
          <option value="1">1/5</option>
          <option value="2">2/5</option>
          <option value="3">3/5</option>
          <option value="4">4/5</option>
          <option value="5">5/5</option>
        </select>
      </div>

      <button type="submit">
        Añadir cómic
      </button>
    </form>

    <p id="form-message"></p>
  </main>

  <script src="add-comic.js"></script>
</body>
</html>
